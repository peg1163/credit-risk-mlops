[project]
name = "credit-risk-mlops"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = [
  "pandas==2.3.3", "pyarrow==21.0.0", "scikit-learn==1.9.0",
  "joblib==1.5.3", "PyYAML==6.0.3", "mlflow==3.5.1"
]
[project.optional-dependencies]
dev = ["pytest==8.4.2"]
[tool.pytest.ini_options]
testpaths = ["data-science/tests"]
pythonpath = ["data-science"]
