name: Terraform plan

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-plan-bootstrap
  cancel-in-progress: false

jobs:
  plan:
    name: Plan bootstrap infrastructure
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: infrastructure/terraform/bootstrap

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Configure temporary AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_TERRAFORM_PLAN_ROLE_ARN }}
          aws-region: us-east-1
          role-session-name: github-actions-terraform-plan
          mask-aws-account-id: true

      - name: Set Terraform account guardrail
        run: echo "TF_VAR_allowed_account_id=$(aws sts get-caller-identity --query Account --output text)" >> "$GITHUB_ENV"

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.15.9"

      - name: Check Terraform formatting
        run: terraform fmt -check

      - name: Initialize remote backend
        run: terraform init -input=false -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" -backend-config="key=bootstrap/terraform.tfstate" -backend-config="region=us-east-1" -backend-config="encrypt=true" -backend-config="use_lockfile=true"

      - name: Validate Terraform configuration
        run: terraform validate -no-color

      - name: Create Terraform plan
        run: terraform plan -input=false -no-color -lock-timeout=60s
