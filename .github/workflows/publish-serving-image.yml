name: Publish serving image

# Release images of the SageMaker serving image, tagged v<semver>-<sha7>
# (ADR-0009). Only main can assume the push role.

on:
  push:
    branches:
      - main
    paths:
      - data-science/src/**
      - data-science/requirements-inference.txt
      - mlops/docker/sagemaker-inference.Dockerfile
      - mlops/docker/sagemaker-inference.version
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-serving-image
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  REPOSITORY: credit-risk-mlops-development-sagemaker-inference
  ENDPOINT_NAME: credit-risk-mlops-development-serving
  RELEASE_IMAGES_TO_KEEP: "10"

jobs:
  publish:
    name: Build and push release image
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Compute release tag
        id: tag
        run: |
          version="$(tr -d '[:space:]' < mlops/docker/sagemaker-inference.version)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid version: $version" >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Configure temporary push credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ECR_PUSH_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: github-actions-publish-serving-image
          mask-aws-account-id: true

      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Skip if the tag already exists
        id: exists
        run: |
          if aws ecr describe-images --repository-name "$REPOSITORY" --image-ids "imageTag=${{ steps.tag.outputs.tag }}" >/dev/null 2>&1; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "Tag ${{ steps.tag.outputs.tag }} already exists; tags are immutable, nothing to push." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify the deployed image stays in the rollback window
        if: steps.exists.outputs.found == 'false'
        run: ./mlops/scripts/check-serving-rollback-window.sh "$REPOSITORY" "$ENDPOINT_NAME" "$RELEASE_IMAGES_TO_KEEP"

      # SageMaker and Lambda need a single image manifest, not an OCI index
      # with provenance or SBOM attestations.
      - name: Build image
        if: steps.exists.outputs.found == 'false'
        run: |
          docker build \
            --provenance=false \
            --sbom=false \
            --file mlops/docker/sagemaker-inference.Dockerfile \
            --build-arg "IMAGE_VERSION=${{ steps.tag.outputs.tag }}" \
            --tag "${{ steps.ecr.outputs.registry }}/$REPOSITORY:${{ steps.tag.outputs.tag }}" \
            .

      - name: Verify image metadata
        if: steps.exists.outputs.found == 'false'
        run: |
          image="${{ steps.ecr.outputs.registry }}/$REPOSITORY:${{ steps.tag.outputs.tag }}"
          test "$(docker image inspect "$image" --format '{{.Config.User}}')" = "appuser"
          docker image inspect "$image" --format '{{range .Config.Env}}{{println .}}{{end}}' | grep -qx "IMAGE_VERSION=${{ steps.tag.outputs.tag }}"

      - name: Push image
        if: steps.exists.outputs.found == 'false'
        run: docker push "${{ steps.ecr.outputs.registry }}/$REPOSITORY:${{ steps.tag.outputs.tag }}"

      - name: Verify single manifest and record digest
        if: steps.exists.outputs.found == 'false'
        run: |
          media_type="$(aws ecr describe-images --repository-name "$REPOSITORY" --image-ids "imageTag=${{ steps.tag.outputs.tag }}" --query 'imageDetails[0].imageManifestMediaType' --output text)"
          case "$media_type" in
            application/vnd.docker.distribution.manifest.v2+json|application/vnd.oci.image.manifest.v1+json) ;;
            *) echo "Unsupported manifest for SageMaker: $media_type" >&2; exit 1 ;;
          esac
          digest="$(aws ecr describe-images --repository-name "$REPOSITORY" --image-ids "imageTag=${{ steps.tag.outputs.tag }}" --query 'imageDetails[0].imageDigest' --output text)"
          echo "Published ${{ steps.tag.outputs.tag }} as $digest ($media_type)"
          {
            echo "### Serving image published"
            echo ""
            echo "- Tag: \`${{ steps.tag.outputs.tag }}\`"
            echo "- Digest: \`$digest\`"
            echo ""
            echo "To deploy it, set \`serving_image_digest = \"$digest\"\` and run the development deploy workflow."
          } >> "$GITHUB_STEP_SUMMARY"
