name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python and shell quality
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: data-science/requirements-inference.txt

      - name: Install inference dependencies
        run: python -m pip install --requirement data-science/requirements-inference.txt

      - name: Check installed dependencies
        run: python -m pip check

      - name: Compile Python source
        run: python -m compileall -q data-science/src data-science/predict.py data-science/tests/fixtures mlops/monitoring mlops/experiments mlops/sagemaker

      - name: Validate inference script syntax
        run: bash -n mlops/scripts/run-inference.sh

      - name: Validate replay script syntax
        run: bash -n mlops/scripts/run-replay.sh

      - name: Validate features script syntax
        run: bash -n mlops/scripts/run-features.sh

      - name: Validate monthly pipeline script syntax
        run: bash -n mlops/scripts/run-monthly-pipeline.sh

      - name: Validate monthly integration script syntax
        run: bash -n mlops/scripts/test-monthly-pipeline.sh

      - name: Validate container integration script syntax
        run: bash -n mlops/scripts/test-inference-container.sh

      - name: Validate serving image script syntax
        run: bash -n mlops/scripts/push-serving-image-dev.sh && bash -n mlops/scripts/check-serving-rollback-window.sh

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python for integration fixtures
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: data-science/requirements-inference.txt

      - name: Install integration fixture dependencies
        run: python -m pip install --requirement data-science/requirements-inference.txt

      - name: Build inference image
        run: docker build --file mlops/docker/inference.Dockerfile --tag credit-risk-inference:ci .

      - name: Verify Python runtime
        run: docker run --rm --entrypoint python credit-risk-inference:ci --version

      - name: Verify non-root default user
        run: test "$(docker image inspect credit-risk-inference:ci --format '{{.Config.User}}')" = "appuser"

      - name: Verify expected entrypoint
        run: test "$(docker image inspect credit-risk-inference:ci --format '{{json .Config.Entrypoint}}')" = '["python","/app/data-science/predict.py"]'

      - name: Build replay image
        run: docker build --file mlops/docker/replay.Dockerfile --tag credit-risk-replay:ci .

      - name: Verify replay non-root user
        run: test "$(docker image inspect credit-risk-replay:ci --format '{{.Config.User}}')" = "appuser"

      - name: Verify replay entrypoint
        run: test "$(docker image inspect credit-risk-replay:ci --format '{{json .Config.Entrypoint}}')" = '["python","/app/data-science/replay.py"]'

      - name: Verify replay initial status
        run: docker run --rm credit-risk-replay:ci --status

      - name: Build features image
        run: docker build --file mlops/docker/features.Dockerfile --tag credit-risk-features:ci .

      - name: Verify features non-root user
        run: test "$(docker image inspect credit-risk-features:ci --format '{{.Config.User}}')" = "appuser"

      - name: Verify features entrypoint
        run: test "$(docker image inspect credit-risk-features:ci --format '{{json .Config.Entrypoint}}')" = '["python","/app/data-science/build_features.py"]'

      - name: Run inference smoke test
        run: ./mlops/scripts/test-inference-container.sh

      - name: Build SageMaker serving image
        run: docker build --file mlops/docker/sagemaker-inference.Dockerfile --build-arg IMAGE_VERSION=ci --tag credit-risk-sagemaker:ci .

      - name: Verify SageMaker serving non-root user and version
        run: |
          test "$(docker image inspect credit-risk-sagemaker:ci --format '{{.Config.User}}')" = "appuser"
          docker image inspect credit-risk-sagemaker:ci --format '{{range .Config.Env}}{{println .}}{{end}}' | grep -qx "IMAGE_VERSION=ci"

      - name: Build SageMaker training image
        run: docker build --file mlops/docker/sagemaker-training.Dockerfile --build-arg IMAGE_VERSION=ci --tag credit-risk-sagemaker-training:ci .

      - name: Verify SageMaker training entrypoint and dependencies
        run: |
          test "$(docker image inspect credit-risk-sagemaker-training:ci --format '{{json .Config.Entrypoint}}')" = '["python","-m","mlops.sagemaker.train"]'
          docker run --rm --entrypoint pip credit-risk-sagemaker-training:ci check
          docker run --rm --entrypoint python credit-risk-sagemaker-training:ci -c "import sagemaker_mlflow, mlops.experiments.retraining, mlops.sagemaker.train"

      - name: Run monthly pipeline integration test
        run: ./mlops/scripts/test-monthly-pipeline.sh

  terraform:
    name: Terraform validation (${{ matrix.stack }})
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        stack:
          - lab-local
          - bootstrap
          - environments/dev

    defaults:
      run:
        working-directory: infrastructure/terraform/${{ matrix.stack }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.15.9"

      - name: Check Terraform formatting
        run: terraform fmt -check

      - name: Build monitoring Lambda zips
        if: matrix.stack == 'environments/dev'
        working-directory: .
        run: python3 mlops/monitoring/build_lambdas.py

      - name: Initialize Terraform without backend
        run: terraform init -backend=false -input=false

      - name: Validate Terraform configuration
        run: terraform validate -no-color

      - name: Run Terraform tests with a mocked provider
        if: matrix.stack == 'environments/dev'
        run: terraform test -no-color

      - name: Create local laboratory plan
        if: matrix.stack == 'lab-local'
        run: terraform plan -var-file=lab.tfvars.example -input=false -lock=false -no-color
