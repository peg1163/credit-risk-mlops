name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python and shell quality
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: data-science/requirements-inference.txt

      - name: Install inference dependencies
        run: python -m pip install --requirement data-science/requirements-inference.txt

      - name: Check installed dependencies
        run: python -m pip check

      - name: Compile Python source
        run: python -m compileall -q data-science/src data-science/predict.py data-science/tests/fixtures

      - name: Validate inference script syntax
        run: bash -n mlops/scripts/run-inference.sh

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build inference image
        run: docker build --file mlops/docker/inference.Dockerfile --tag credit-risk-inference:ci .

      - name: Verify Python runtime
        run: docker run --rm --entrypoint python credit-risk-inference:ci --version

      - name: Verify non-root default user
        run: test "$(docker image inspect credit-risk-inference:ci --format '{{.Config.User}}')" = "appuser"

      - name: Verify expected entrypoint
        run: test "$(docker image inspect credit-risk-inference:ci --format '{{json .Config.Entrypoint}}')" = '["python","/app/data-science/predict.py"]'

      - name: Create fixture directories
        run: mkdir -p "$RUNNER_TEMP/credit-risk-fixture/model" "$RUNNER_TEMP/credit-risk-fixture/input" "$RUNNER_TEMP/credit-risk-fixture/output"

      - name: Generate synthetic inference fixture
        run: >-
          docker run --rm
          --user "$(id -u):$(id -g)"
          --entrypoint python
          --volume "$GITHUB_WORKSPACE/data-science/tests/fixtures:/fixtures-source:ro"
          --volume "$RUNNER_TEMP/credit-risk-fixture:/fixtures"
          credit-risk-inference:ci
          /fixtures-source/create_inference_fixture.py
          --model /fixtures/model/champion.joblib
          --input /fixtures/input/input.parquet

      - name: Run container inference
        run: >-
          MODEL_PATH="$RUNNER_TEMP/credit-risk-fixture/model/champion.joblib"
          INPUT_DIR="$RUNNER_TEMP/credit-risk-fixture/input"
          OUTPUT_DIR="$RUNNER_TEMP/credit-risk-fixture/output"
          IMAGE_NAME="credit-risk-inference:ci"
          ./mlops/scripts/run-inference.sh
          input.parquet
          predictions.parquet

      - name: Validate inference output
        run: >-
          docker run --rm
          --user "$(id -u):$(id -g)"
          --entrypoint python
          --volume "$GITHUB_WORKSPACE/data-science/tests/fixtures:/fixtures-source:ro"
          --volume "$RUNNER_TEMP/credit-risk-fixture:/fixtures:ro"
          credit-risk-inference:ci
          /fixtures-source/validate_inference_output.py
          --input /fixtures/output/predictions.parquet
          --expected-rows 6
