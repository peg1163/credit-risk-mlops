name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python and shell quality
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: data-science/requirements-inference.txt

      - name: Install inference dependencies
        run: python -m pip install --requirement data-science/requirements-inference.txt

      - name: Check installed dependencies
        run: python -m pip check

      - name: Compile Python source
        run: python -m compileall -q data-science/src data-science/predict.py data-science/tests/fixtures

      - name: Validate inference script syntax
        run: bash -n mlops/scripts/run-inference.sh

      - name: Validate replay script syntax
        run: bash -n mlops/scripts/run-replay.sh

      - name: Validate features script syntax
        run: bash -n mlops/scripts/run-features.sh

      - name: Validate container integration script syntax
        run: bash -n mlops/scripts/test-inference-container.sh

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build inference image
        run: docker build --file mlops/docker/inference.Dockerfile --tag credit-risk-inference:ci .

      - name: Verify Python runtime
        run: docker run --rm --entrypoint python credit-risk-inference:ci --version

      - name: Verify non-root default user
        run: test "$(docker image inspect credit-risk-inference:ci --format '{{.Config.User}}')" = "appuser"

      - name: Verify expected entrypoint
        run: test "$(docker image inspect credit-risk-inference:ci --format '{{json .Config.Entrypoint}}')" = '["python","/app/data-science/predict.py"]'

      - name: Build replay image
        run: docker build --file mlops/docker/replay.Dockerfile --tag credit-risk-replay:ci .

      - name: Verify replay non-root user
        run: test "$(docker image inspect credit-risk-replay:ci --format '{{.Config.User}}')" = "appuser"

      - name: Verify replay entrypoint
        run: test "$(docker image inspect credit-risk-replay:ci --format '{{json .Config.Entrypoint}}')" = '["python","/app/data-science/replay.py"]'

      - name: Verify replay initial status
        run: docker run --rm credit-risk-replay:ci --status

      - name: Build features image
        run: docker build --file mlops/docker/features.Dockerfile --tag credit-risk-features:ci .

      - name: Verify features non-root user
        run: test "$(docker image inspect credit-risk-features:ci --format '{{.Config.User}}')" = "appuser"

      - name: Verify features entrypoint
        run: test "$(docker image inspect credit-risk-features:ci --format '{{json .Config.Entrypoint}}')" = '["python","/app/data-science/build_features.py"]'

      - name: Run inference smoke test
        run: ./mlops/scripts/test-inference-container.sh
